name = "tests"
description = "Pure Ada zlib, gzip, and raw Deflate compression and decompression"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
website = ""
tags = ["zlib", "deflate", "gzip", "compression", "ada"]

executables = ["tests"]

# Stack checking in zlib itself, not only in the suite: the small-stack tests
# need an overflow in the library's own frames to raise Storage_Error every
# time, and -fstack-check is what makes it so (see zlib.gpr and tests.gpr).
[gpr-set-externals]
ZLIB_STACK_CHECK = "true"

[[depends-on]]
gnat_native = "^15"

[[depends-on]]
zlib = "^1.3.0+."

[[pins]]
zlib = { path='..' }

[[depends-on]]
aunit = "^26.0.0"


[[depends-on]]
project_tools = "*"

[[pins]]
project_tools = { path = "../../project_tools" }

# Pins are root-only in Alire: this root builds zlib, so it must pin cryptolib.
[[pins]]
cryptolib = { path = "../../cryptolib" }
